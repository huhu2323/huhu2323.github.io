---
layout: default
---
<article class="post">
  <p class="post__back"><a href="{{ '/blog/' | relative_url }}">&larr; Back to blog</a></p>
  <h1 class="post__title">{{ page.title }}</h1>
  <p class="post__meta">{{ page.date | date: "%B %-d, %Y" }}</p>
  <div class="post-content">
    {{ content }}
  </div>
</article>
